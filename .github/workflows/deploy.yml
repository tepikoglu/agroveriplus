name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── Backend: Lint + Test ────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # ─── Frontend: Validate HTML ─────────────────────────────
  frontend-validate:
    name: Frontend Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check HTML files exist
        run: |
          test -f index.html || (echo "index.html not found" && exit 1)
          test -f demo.html || (echo "demo.html not found" && exit 1)

  # ─── Docker: Build full stack ────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-validate]

    steps:
      - uses: actions/checkout@v4

      - name: Build frontend image
        run: docker build -t agroveriplus-web:${{ github.sha }} .

      - name: Build backend image
        run: docker build -t agroveriplus-api:${{ github.sha }} ./backend

      - name: Start full stack
        run: |
          docker network create agro-test
          docker run -d --name test-db --network agro-test \
            -e POSTGRES_DB=agroveriplus \
            -e POSTGRES_USER=agroveri \
            -e POSTGRES_PASSWORD=agroveri \
            postgres:16-alpine
          sleep 5
          docker run -d --name test-api --network agro-test \
            -e DATABASE_URL=postgresql+asyncpg://agroveri:agroveri@test-db:5432/agroveriplus \
            -p 8000:8000 \
            agroveriplus-api:${{ github.sha }}
          docker run -d --name test-web --network agro-test \
            -p 8080:80 \
            agroveriplus-web:${{ github.sha }}
          sleep 3

      - name: Test frontend serves
        run: |
          curl -f http://localhost:8080/ || (docker logs test-web && exit 1)
          curl -f http://localhost:8080/demo.html || exit 1

      - name: Test API health
        run: |
          curl -f http://localhost:8000/api/health || (docker logs test-api && exit 1)

      - name: Cleanup
        if: always()
        run: |
          docker stop test-web test-api test-db 2>/dev/null || true
          docker rm test-web test-api test-db 2>/dev/null || true
          docker network rm agro-test 2>/dev/null || true
