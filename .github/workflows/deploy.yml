name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check HTML files exist
        run: |
          test -f index.html || (echo "index.html not found" && exit 1)
          test -f demo.html || (echo "demo.html not found" && exit 1)

      - name: Validate HTML syntax
        uses: nickersoft/html-validate-action@v1
        with:
          files: "*.html"
        continue-on-error: true

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t agroveriplus:${{ github.sha }} .

      - name: Test container starts
        run: |
          docker run -d --name test-container -p 8080:80 agroveriplus:${{ github.sha }}
          sleep 3
          curl -f http://localhost:8080/ || (docker logs test-container && exit 1)
          curl -f http://localhost:8080/demo.html || exit 1
          curl -f http://localhost:8080/health || exit 1
          docker stop test-container

