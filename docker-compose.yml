services:
  # Frontend — Nginx serving static files
  web:
    build: .
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  # Backend — FastAPI application
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-agroveri}:${DB_PASSWORD:-agroveri}@db:5432/agroveriplus
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
      - IPFS_API_KEY=${IPFS_API_KEY:-}
      - IPFS_API_SECRET=${IPFS_API_SECRET:-}
      - CORS_ORIGINS=["http://localhost:8080","http://localhost:3000"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Database — PostgreSQL
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agroveriplus
      POSTGRES_USER: ${DB_USER:-agroveri}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-agroveri}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-agroveri}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
